<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gift Clock</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
}

body{
  font-family:Arial,Helvetica,sans-serif;
}

.clock{
  width:100vw;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#111;
  gap:clamp(30px,5vh,70px);
}

/* NISHA animation */
.krishna{
  color:#A21C1C;
  font-size:clamp(35px,7vw,90px);
  font-weight:800;
  letter-spacing:5px;
  white-space:nowrap;

  animation:
    float 2.2s ease-in-out infinite,
    glow 1.8s ease-in-out infinite alternate;
}

.krishna span{
  display:inline-block;
  animation:letter 1.5s ease-in-out infinite;
}

.krishna span:nth-child(1){animation-delay:0s}
.krishna span:nth-child(2){animation-delay:.12s}
.krishna span:nth-child(3){animation-delay:.24s}
.krishna span:nth-child(4){animation-delay:.36s}
.krishna span:nth-child(5){animation-delay:.48s}
.krishna span:nth-child(6){animation-delay:.60s}
.krishna span:nth-child(7){animation-delay:.72s}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-12px)}
}

@keyframes glow{
  from{
    text-shadow:0 0 5px #fff,0 0 12px #6cf;
  }

  to{
    text-shadow:0 0 10px #fff,0 0 30px #4af,0 0 50px #8cf;
  }
}

@keyframes letter{
  0%,100%{
    transform:translateY(0) scale(1);
  }

  50%{
    transform:translateY(-9px) scale(1.05);
  }
}

/* Clock */
.time{
  color:#FF0087;
  font-size:clamp(65px,13vw,190px);
  line-height:.9;
  font-weight:400;
  letter-spacing:2px;
  white-space:nowrap;
  text-align:center;
}

.date{
  color:#FF0087;
  font-size:clamp(25px,3.5vw,55px);
  margin-top:24px;
  white-space:nowrap;
  text-align:center;
}

@media(max-width:700px){

  .clock{
    gap:28px;
  }

  .time{
    font-size:14vw;
  }

  .date{
    font-size:4.5vw;
    margin-top:14px;
  }

  .krishna{
    font-size:7vw;
    letter-spacing:2px;
  }
}
</style>
</head>

<body>

<div class="clock">

  <!-- NISHA Animation -->
  <div class="krishna">
    <span>🎀</span>
    <span>N</span>
    <span>I</span>
    <span>S</span>
    <span>H</span>
    <span>A</span>
    <span>🎀</span>
  </div>

  <!-- Clock -->
  <div>
    <div id="time" class="time">00:00:00</div>
    <div id="date" class="date"></div>
  </div>

</div>

<script>
function updateClock(){

  const now = new Date();

  document.getElementById("time").textContent =
    now.toLocaleTimeString("en-IN",{
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit",
      hour12:false
    });

  document.getElementById("date").textContent =
    now.toLocaleDateString("en-US",{
      weekday:"long",
      month:"long",
      day:"numeric",
      year:"numeric"
    });
}

updateClock();
setInterval(updateClock,1000);
</script>

</body>
</html>
